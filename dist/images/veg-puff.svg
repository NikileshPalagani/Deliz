<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="puffGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="shadowPuff" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#111827" rx="16"/>
  <!-- Plate -->
  <ellipse cx="200" cy="225" rx="150" ry="38" fill="#1f2937" opacity="0.8" />
  <ellipse cx="200" cy="220" rx="130" ry="28" fill="#374151" opacity="0.4" />
  <!-- Puff Pastry Layers -->
  <g filter="url(#shadowPuff)">
    <!-- Base Layer -->
    <rect x="90" y="100" width="220" height="110" rx="18" fill="url(#puffGrad)" stroke="#92400e" stroke-width="3"/>
    <!-- Top Flaky Layer -->
    <path d="M 95,110 C 130,85 270,85 305,110 C 315,140 310,180 305,195 C 270,215 130,215 95,195 Z" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
    <!-- Flaky Cracks / Layers -->
    <path d="M 110,125 Q 200,105 290,125" stroke="#78350f" stroke-width="3.5" fill="none"/>
    <path d="M 105,150 Q 200,135 295,150" stroke="#78350f" stroke-width="3" fill="none"/>
    <path d="M 115,175 Q 200,165 285,175" stroke="#78350f" stroke-width="2.5" fill="none"/>
    <!-- Veg filling peeking through -->
    <ellipse cx="200" cy="150" rx="28" ry="7" fill="#16a34a" opacity="0.9"/>
    <circle cx="190" cy="150" r="3" fill="#dc2626"/>
    <circle cx="210" cy="150" r="3.5" fill="#facc15"/>
  </g>
</svg>
