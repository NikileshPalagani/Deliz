<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="chickenPuffGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="40%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="fillingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <filter id="shadowChickenPuff" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#111827" rx="16"/>
  <!-- Plate -->
  <ellipse cx="200" cy="225" rx="150" ry="38" fill="#1f2937" opacity="0.8" />
  <!-- Puff Shape with Spicy Chicken Filling -->
  <g filter="url(#shadowChickenPuff)">
    <rect x="85" y="90" width="230" height="125" rx="22" fill="url(#chickenPuffGrad)" stroke="#78350f" stroke-width="3"/>
    <!-- Cutout showcasing juicy spicy shredded chicken masala -->
    <path d="M 155,130 Q 200,118 245,130 Q 255,165 240,175 Q 200,185 160,175 Z" fill="url(#fillingGrad)" stroke="#991b1b" stroke-width="2"/>
    <!-- Herbs & Roast spices -->
    <circle cx="185" cy="142" r="3" fill="#15803d"/>
    <circle cx="215" cy="158" r="2.5" fill="#16a34a"/>
    <circle cx="195" cy="162" r="3.5" fill="#450a0a"/>
    <circle cx="225" cy="140" r="3" fill="#450a0a"/>
    <circle cx="170" cy="155" r="2.5" fill="#facc15"/>
    <!-- Flaky Pastry Cuts -->
    <path d="M 100,115 Q 140,105 155,115" stroke="#78350f" stroke-width="2.5" fill="none"/>
    <path d="M 245,115 Q 275,105 300,115" stroke="#78350f" stroke-width="2.5" fill="none"/>
    <path d="M 95,180 Q 135,195 155,185" stroke="#78350f" stroke-width="2.5" fill="none"/>
    <path d="M 245,185 Q 275,195 305,180" stroke="#78350f" stroke-width="2.5" fill="none"/>
  </g>
</svg>
