<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="crustGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdba74" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#111827" rx="16"/>
  <!-- Plate / glow -->
  <ellipse cx="200" cy="230" rx="140" ry="35" fill="#1f2937" opacity="0.8" />
  <ellipse cx="200" cy="225" rx="120" ry="25" fill="#374151" opacity="0.4" />
  <!-- Samosa Body -->
  <g filter="url(#shadow)">
    <path d="M 200,45 Q 225,90 285,210 Q 200,240 115,210 Q 175,90 200,45 Z" fill="url(#crustGrad)" stroke="#7c2d12" stroke-width="4"/>
    <!-- Fold / Ridges -->
    <path d="M 200,48 Q 205,120 200,225" stroke="#7c2d12" stroke-width="3" stroke-dasharray="4,2" fill="none" opacity="0.6"/>
    <path d="M 120,208 Q 200,236 280,208" stroke="#fdba74" stroke-width="3" fill="none" opacity="0.8"/>
    <!-- Crisp spots -->
    <circle cx="170" cy="130" r="4" fill="#7c2d12" opacity="0.5"/>
    <circle cx="230" cy="150" r="5" fill="#7c2d12" opacity="0.6"/>
    <circle cx="190" cy="180" r="3" fill="#7c2d12" opacity="0.5"/>
    <circle cx="220" cy="110" r="3" fill="#fdba74" opacity="0.7"/>
    <circle cx="160" cy="160" r="3.5" fill="#fdba74" opacity="0.8"/>
  </g>
  <!-- Mint Chutney accent -->
  <circle cx="85" cy="220" r="22" fill="#15803d" stroke="#22c55e" stroke-width="2"/>
  <circle cx="82" cy="217" r="16" fill="#16a34a"/>
  <!-- Coriander garnish -->
  <path d="M 195,35 C 190,25 210,25 205,35 Z" fill="#22c55e"/>
</svg>
